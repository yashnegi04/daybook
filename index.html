<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5ECDD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="wrap"></div>
<nav id="nav" class="nav"></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<input id="filePhoto" type="file" accept="image/*" multiple hidden>
<input id="fileImport" type="file" accept="application/json,.json" hidden>
<script src="config.js"></script>
<script src="js/quotes.js"></script>
<script src="js/store.js"></script>
<script src="js/parse.js"></script>
<script src="js/push.js"></script>
<script src="js/app.js"></script>
</body>
</html>
